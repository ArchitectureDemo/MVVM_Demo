apply plugin: 'com.android.application'

android {
    compileSdkVersion 37
    defaultConfig {
        applicationId "mvvm.activity"
        minSdkVersion 27
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        dataBinding {
            enabled true
        }
    }

    namespace 'mvvm.activity'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.appcompat
}